name: Automated Data Preprocessing

# Trigger: setiap push ke main, manual dispatch, dan terjadwal harian.
on:
  push:
    branches: [ main ]
    paths:
      - 'preprocessing/**'
      - '.github/workflows/preprocessing.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # setiap hari pukul 00:00 UTC

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run preprocessing automation
        working-directory: preprocessing
        run: |
          python automate_Trinata-Suryawan.py \
            --input heart_raw.csv \
            --output-dir namadataset_preprocessing

      - name: Commit & push processed dataset
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/namadataset_preprocessing/*.csv
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada dataset hasil preprocessing."
          else
            git commit -m "ci: update preprocessed dataset [skip ci]"
            git push
          fi
